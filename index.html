sk:d=>{const s=find('skills',d.id);s.d=!s.d;save();render()},dsk:d=>{D.skills=D.skills.filter(s=>s.id!==d.id);save();render()},
ask:d=>form('عنصر جديد',[['t','العنوان *'],['note','ملاحظة','area']],{},o=>{if(!o.t)return'العنوان مطلوب';D.skills.push({id:uid(),area:d.ar,d:false,...o});save();render()}),
nb:()=>bookForm({state:'list',start:TD()}),eb:d=>bookForm(find('books',d.id)),db:d=>ask('حذف الكتاب؟',()=>{D.books=D.books.filter(b=>b.id!==d.id);save();render()}),
bs:d=>{const b=find('books',d.id);form('جلسة قراءة',[['p','عدد الصفحات المقروءة','number'],['n','ملاحظات','area']],{},o=>{if(!o.p)return'أدخل عدد الصفحات';b.cur=Math.min(b.pages,b.cur+o.p);(b.sessions=b.sessions||[]).push({d:TD(),p:o.p,n:o.n});if(b.cur>=b.pages)b.state='done';else if(b.state=='list')b.state='now';save();toast('سُجلت الجلسة');render()})},
bt:d=>{const b=find('books',d.id);if(!b.end||b.end<TD()){toast('حدّد موعدًا مستهدفًا قادمًا للكتاب','e');return}const days=(pd(b.end)-pd(TD()))/864e5+1,pdp=b.perDay||Math.ceil((b.pages-b.cur)/days);let s=TD(),p=b.cur,c=0;
while(s<=b.end&&p<b.pages){let e=add(wkS(s),6);if(e>b.end)e=b.end;const n=(pd(e)-pd(s))/864e5+1,q=Math.min(b.pages,p+pdp*n);D.tasks.push({id:uid(),title:`قراءة «${b.title}» ص ${p+1}–${q}`,cat:'علمي',start:s,due:e,pri:'med',status:'todo',est:30*n,subs:[]});p=q;s=add(e,1);c++}save();toast('أُنشئت '+c+' مهمة قراءة');render()},
nl:()=>lectForm({state:'new',diff:2}),el:d=>lectForm(find('lects',d.id)),dl:d=>ask('حذف المحاضرة؟',()=>{D.lects=D.lects.filter(l=>l.id!==d.id);save();render()}),
ls:d=>{const l=find('lects',d.id);l.state='review';l.r=0;l.reviewDate=add(TD(),1);save();toast('جُدولت مراجعة غدًا');render()},
lr:d=>{const l=find('lects',d.id),iv=[1,3,7,21];l.r=(l.r||0)+1;if(l.r>=iv.length){l.state='done';l.reviewDate=''}else l.reviewDate=add(TD(),iv[l.r]);save();toast('أحسنت');render()},
ex:()=>modal(`<h3>تصدير</h3><textarea class="big" id="xo" readonly>${esc(JSON.stringify(D))}</textarea><div class="ac"><button class="btn" data-a="cp">نسخ</button><button class="btn s" data-a="xm">إغلاق</button></div>`),
cp:()=>{const e=$('#xo');e.select();try{document.execCommand('copy');toast('تم النسخ')}catch(x){toast('انسخ النص يدويًا','e')}},
im:()=>form('استيراد',[['j','الصق نص JSON هنا','area']],{},o=>{try{const x=JSON.parse(o.j);if(!Array.isArray(x.tasks))throw 0;ask('سيستبدل هذا بياناتك الحالية. متابعة؟',()=>{D=norm(x);save();theme();toast('تم الاستيراد');render()})}catch(e){return'النص غير صالح'}}),
bk:()=>{try{localStorage.setItem(K+'_bk',JSON.stringify(D));toast('حُفظت نسخة محلية')}catch(e){toast('تعذّر الحفظ','e')}},
rb:()=>{try{const x=JSON.parse(localStorage.getItem(K+'_bk'));if(!x)throw 0;ask('استعادة آخر نسخة محلية؟',()=>{D=norm(x);save();theme();render()})}catch(e){toast('لا توجد نسخة محلية','e')}},
rst:()=>ask('سيتم حذف كل بياناتك نهائيًا. متأكد؟',()=>{D=norm({});save();render();toast('تم الحذف')})};
function bookForm(b){const n=!b.id;form(n?'كتاب جديد':'تعديل الكتاب',[['title','اسم الكتاب *'],['author','المؤلف'],['cat','التصنيف','text','cl'],['state','الحالة','sel',[['list','قائمة القراءة'],['now','أقرأ حاليًا'],['done','مكتمل'],['pause','متوقف مؤقتًا']]],['pages','عدد الصفحات *','number'],['cur','الصفحة الحالية','number'],['start','بدء القراءة','date'],['end','الموعد المستهدف','date'],['perDay','صفحات يوميًا (اختياري)','number']],{cur:0,...b},o=>{if(!o.title)return'اسم الكتاب مطلوب';if(!o.pages||o.pages<1)return'أدخل عدد الصفحات';o.cur=o.cur||0;if(o.cur>o.pages)return'الصفحة الحالية أكبر من عدد الصفحات';if(o.start&&o.end&&o.end<o.start)return'الموعد المستهدف قبل البداية';if(n)D.books.push({id:uid(),...o});else Object.assign(b,o);save();toast('تم الحفظ');render()})}
function lectForm(l){const n=!l.id;form(n?'محاضرة جديدة':'تعديل المحاضرة',[['course','المادة *'],['title','المحاضرة *'],['state','الحالة','sel',[['new','جديدة'],['study','تحتاج دراسة'],['review','تحتاج مراجعة'],['done','تمت دراستها']]],['diff','الصعوبة','sel',[[1,'سهلة'],[2,'متوسطة'],[3,'صعبة']]],['studyDate','موعد الدراسة','date'],['reviewDate','موعد المراجعة','date'],['notes','ملاحظات وأسئلة','area']],l,o=>{if(!o.course||!o.title)return'المادة والمحاضرة مطلوبتان';o.diff=+o.diff;if(n)D.lects.push({id:uid(),...o});else Object.assign(l,o);save();toast('تم الحفظ');render()})}
document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(b&&A[b.dataset.a])A[b.dataset.a](b.dataset,b,e)});
document.addEventListener('input',e=>{const t=e.target;if(t.dataset.f!==undefined){S.f[t.dataset.f]=t.value;$('#tl').innerHTML=tl()}});
document.addEventListener('change',e=>{const t=e.target;if(t.id=='dn'){D.notes[S.dy]=t.value;save()}if(t.dataset.s){const k=t.dataset.s;D.set[k]=k=='ws'?+t.value:t.value;save();theme();render()}if(t.dataset.sf!==undefined){S.sf[t.dataset.sf]=t.value;render()}});
theme();render();
if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
</script></body></html>
